name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So the suite can be re-run from the Actions tab without inventing a commit.
  # The first run of this workflow needed exactly that and could not have it.
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install step: the runtime has no dependencies, and that is a
      # property worth noticing if it ever stops being true.
      - name: Check for dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ] || [ -d node_modules ]; then
            echo "Smarsh has no dependencies; something added one."
            exit 1
          fi

      - name: Version is consistent
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          cli=$(node bin/smarsh.mjs --version)
          if [ "$pkg" != "$cli" ]; then
            echo "package.json says $pkg, the CLI says $cli"
            exit 1
          fi
          grep -q "\[$pkg\]" CHANGELOG.md || { echo "no changelog entry for $pkg"; exit 1; }

      # `shell: bash` is not decoration. Without it Windows runs this under
      # PowerShell, which does not expand `tests/*.test.mjs`, so node receives
      # the pattern as a literal filename and finds nothing. Three of the nine
      # jobs failed on the first run for exactly this.
      - name: Test
        shell: bash
        run: node --test tests/*.test.mjs

      # `std/` was once missing from the package's file list, so an installed
      # copy had no standard library while every local test passed. Only a real
      # install catches packaging.
      - name: The published package works from a clean install
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/install-check"
          cd "$RUNNER_TEMP/install-check"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/smarsh-*.tgz
          printf 'import "std/math" as math\nprint(math.mean([2, 4, 6]))\n' > hello.smarsh
          test "$(npx smarsh run hello.smarsh)" = "4"

          # The README's headline claim is that an auditor can check a record
          # without trusting this project. That is only true if the verifier
          # actually ships -- it did not: `tools/` was missing from the package
          # file list, exactly as `std/` once was. So the whole auditor workflow
          # runs here, against the installed package only.
          npx smarsh keygen -o audit.pem
          npx smarsh run node_modules/smarsh/examples/demo.smarsh --grant fs --principal compliance --audit run.json --key audit.pem
          npx smarsh-verify run.json audit.pem.pub | grep -q INTACT

          # And it has to reject a tampered one, or it proves nothing.
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('run.json','utf8'));m.events[0].event='data.release_allowed';fs.writeFileSync('tampered.json',JSON.stringify(m));"
          if npx smarsh-verify tampered.json audit.pem.pub; then
            echo "the shipped verifier accepted a tampered record"
            exit 1
          fi

      - name: The standard library's own tests
        run: node bin/smarsh.mjs test std/

      - name: Everything is formatted
        run: node bin/smarsh.mjs fmt examples/ --check

      # Every example, run the way its own header says to run it. This used to
      # be a hand-written list here, and it drifted: `crypto` was split into two
      # capabilities, the list kept saying `--grant crypto`, and the example was
      # failing unnoticed because this list was the only thing that ran it.
      - name: Run the examples
        run: node tools/run-examples.mjs

      # Nothing else generates programs at this volume, and the one defect it
      # has found so far -- control-flow signals escaping as raw JavaScript
      # objects -- was not reachable from any hand-written test.
      - name: Fuzz the runtime
        run: node tools/fuzz.mjs 20000

      # The compiled engine is only allowed to change how fast a program runs.
      # Every example, every std module and three thousand generated programs
      # run on both engines and are compared on stdout, failure, result, step
      # count, call count and the whole audit trace. `smarsh audit` signs a claim
      # that a run replays from its seed; an engine that quietly diverged would
      # make that claim false.
      # Only on the newest Node, and only once. The tool measures coverage with
      # `--test-coverage-exclude`, which arrived in Node 22.5 -- on 18 and 20 it
      # is an unknown flag and the process dies. It is a documentation check, so
      # running it on one of the nine jobs is the whole value of running it.
      - name: The README's numbers must be the repository's numbers
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        shell: bash
        run: |
          # "151 tests across 4 files" survived in the README long after there
          # were 700 across 30. A prose number nobody checks is a number that
          # will be wrong, and being wrong about the easy claims is not a good
          # look on the ones that are harder to verify.
          node tools/readme-stats.mjs

      - name: The compiled engine matches the tree-walker exactly
        run: node tools/differential.mjs

      - name: Every example and std module must check clean
        shell: bash
        run: |
          # The gradual guarantee is only worth something if it holds on real
          # code. Every example, not a hand-written subset -- the subset here
          # had fallen five examples behind the directory.
          #
          # `std/` is included because it was not, and a false positive from the
          # type checker had been sitting in std/str.smarsh unnoticed: `+` is
          # overloaded, and two `dyn` operands were being typed as `num`.
          #
          # agents.smarsh is the one exclusion: it contains a deliberate race,
          # and the step below asserts that the checker still finds it.
          for f in examples/*.smarsh std/*.smarsh; do
            [ "$f" = "examples/agents.smarsh" ] && continue
            node bin/smarsh.mjs check "$f"
          done

      - name: The verifier must not overclaim on the known-bad contracts
        shell: bash
        run: |
          # examples/contracts.smarsh contains deliberately false contracts. The
          # false ones are nonlinear, so the solver cannot settle them and
          # correctly reports `undecided` rather than `refuted` -- being unable
          # to decide is the sound answer, and `prove` is the tool that catches
          # them (the next step). This step used to assert a non-zero exit here,
          # which the verifier never produces on this file; it went unnoticed
          # because the whole workflow referenced a binary path that did not
          # exist, so CI had never run.
          #
          # What must hold is that it does not claim to have proved them.
          out=$(node bin/smarsh.mjs verify examples/contracts.smarsh)
          echo "$out"
          echo "$out" | grep -q "undecided" || {
            echo "verify settled everything in a file it should not be able to settle"
            exit 1
          }

      - name: Contracts must still hold where they are supposed to
        shell: bash
        run: |
          # examples/contracts.smarsh ships deliberate counterexamples, so a
          # zero exit here would mean the prover stopped finding them.
          if node bin/smarsh.mjs prove examples/contracts.smarsh; then
            echo "prove found nothing in a file that contains known-bad contracts"
            exit 1
          fi

      - name: A bundle must run standalone
        shell: bash
        run: |
          node bin/smarsh.mjs build examples/tour.smarsh -o ci-tour.mjs
          node ci-tour.mjs > ci-bundled.txt
          node bin/smarsh.mjs run examples/tour.smarsh > ci-direct.txt
          diff ci-bundled.txt ci-direct.txt
          rm -f ci-tour.mjs ci-bundled.txt ci-direct.txt

      - name: The race checker must still see the planted race
        shell: bash
        run: |
          if node bin/smarsh.mjs check examples/agents.smarsh; then
            echo "check found no race in a file that contains one"
            exit 1
          fi
